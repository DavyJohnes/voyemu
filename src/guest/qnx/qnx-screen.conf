begin khronos
  begin egl display 1
    egl-dlls = libESXEGL_Adreno.so
    glesv2-dlls = libESXGLESv2_Adreno.so
    glesv1-dlls = libESXGLESv1_CM_Adreno.so
    eglsub-dlls = libscreen.so.1 libeglSubDriverQnx.so
    c2d-dlls = c2d30.so
    gralloc-module = Adreno
  end egl display

  begin wfd device 1
    wfd-dlls = libopenwfd_qnx.so
  end wfd device
end khronos
begin winmgr
  begin globals
    alloc-config = stdbuf
    blit-config = sw
    default-display = 1
  end globals
  begin display 1
    video-mode = 1920 x 720 @ 60
    cursor = none
  end display
  begin class framebuffer1
    display = 1
    format = rgba8888
    usage = read
  end class
end winmgr
