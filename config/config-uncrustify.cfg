# Voyemu blank-line rules for Uncrustify 0.83.0, run between two clang-format passes that own
# every other layout decision: blank lines around control statements, before a return that is not
# first in its block, after the declarations at the top of a function and around function
# definitions.
newlines                        = lf
input_tab_size                  = 4
output_tab_size                 = 4
indent_columns                  = 4
indent_with_tabs                = 0
indent_continue                 = 8
indent_cpp_lambda_only_once     = true
disable_processing_cmt          = " clang-format off"
enable_processing_cmt           = " clang-format on"
cmt_indent_multi                = false
cmt_reflow_mode                 = 1

# Spacing stays as clang-format left it.
sp_enum_brace                   = ignore
sp_pp_concat                    = ignore
sp_after_type                   = ignore
sp_angle_shift                  = ignore
sp_before_semi                  = ignore
sp_after_semi                   = ignore
sp_after_semi_for               = ignore
sp_before_vardef_square         = ignore
sp_before_comma                 = ignore
sp_paren_comma                  = ignore
sp_after_constr_colon           = ignore
sp_before_constr_colon          = ignore
sp_before_case_colon            = ignore
sp_return                       = ignore
sp_super_paren                  = ignore
sp_this_paren                   = ignore
sp_word_brace_ns                = ignore
sp_not                          = ignore
sp_inv                          = ignore
sp_addr                         = ignore
sp_member                       = ignore
sp_deref                        = ignore
sp_sign                         = ignore
sp_incdec                       = ignore
sp_before_nl_cont               = ignore
sp_before_emb_cmt               = ignore
sp_after_emb_cmt                = ignore

# Line breaking stays with clang-format.
nl_collapse_empty_body          = true
nl_assign_leave_one_liners      = true
nl_class_leave_one_liners       = true
nl_enum_leave_one_liners        = true
nl_func_leave_one_liners        = true
nl_cpp_lambda_leave_one_liners  = true
nl_if_leave_one_liners          = true
nl_while_leave_one_liners       = true
nl_do_leave_one_liners          = true
nl_for_leave_one_liners         = true
nl_oc_msg_leave_one_liner       = true

# Blank lines around control statements; a try needs none.
nl_before_if                    = force
nl_after_if                     = force
nl_before_for                   = force
nl_after_for                    = force
nl_before_while                 = force
nl_after_while                  = force
nl_before_switch                = force
nl_after_switch                 = force
nl_before_do                    = force
nl_after_do                     = force
nl_before_synchronized          = force
nl_after_synchronized           = force
nl_after_try_catch_finally      = 2
nl_before_ignore_after_case     = true
nl_squeeze_ifdef                = true

# Blank line before a return unless it is first in its block.
nl_before_return                = true

# Blank line after the declarations at the top of a function only.
nl_var_def_blk_end_func_top     = 1
nl_var_def_blk_end              = 0

# Blank line between function definitions and between a function and the declarations or other
# code around it at file, namespace and class scope; a comment directly above a function stays
# with it. Consecutive declarations keep their own blank lines.
nl_before_func_body_def         = 2
nl_before_func_class_def        = 2
nl_after_func_body              = 2
nl_after_func_body_one_liner    = 2

# No blank line at the start or end of a namespace or extern "C" body, or inside the edges of a
# top-level #if.
eat_blanks_after_open_brace     = true
eat_blanks_before_close_brace   = true
nl_squeeze_ifdef_top_level      = true
