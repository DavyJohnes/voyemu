# Voyemu C, C++ and Objective-C++ formatting for clang-format 23.1.3.
# Apply with the format and format-check CMake targets; they pass this file through --style=file:.
---
BasedOnStyle: LLVM

# Indentation: 4 spaces, continuation 8, access modifiers and ObjC blocks follow the block indent.
IndentWidth: 4
ContinuationIndentWidth: 8
AccessModifierOffset: -4
ObjCBlockIndentWidth: 4

# Line length matches config-editor; long string literals stay whole so logs remain searchable.
ColumnLimit: 100
BreakStringLiterals: false
PenaltyBreakAssignment: 25

# Braces on every control statement body; short bodies only when empty.
InsertBraces: true
AllowShortBlocksOnASingleLine: Empty
AllowShortFunctionsOnASingleLine: Empty
AllowShortLambdasOnASingleLine: Empty
AllowShortEnumsOnASingleLine: false

# Pointer and reference bind to the name; no column alignment that rewrites neighbouring lines.
PointerAlignment: Right
AlignConsecutiveAssignments: None
AlignConsecutiveDeclarations: None

# Exactly one final newline; no empty line at the start of a block.
InsertNewlineAtEOF: true
KeepEmptyLines:
  AtStartOfBlock: false

# Macros that expand to statements or declarations and take no trailing semicolon.
StatementMacros: [BOUNDARY_FIELDS32, BOUNDARY_FIELDS64, STUB_IV, STUB_PV]

# Includes sort within blank-line separated blocks: project headers, then winsock2,
# then windows.h, then other system headers, so Win32 headers keep their required order.
IncludeCategories:
  - Regex: '^<(winsock2|ws2tcpip)\.h>'
    Priority: 2
  - Regex: '^<windows\.h>'
    Priority: 3
  - Regex: '^<'
    Priority: 4
  - Regex: '.*'
    Priority: 1
